plugins { id 'org.jetbrains.kotlin.jvm' version '1.9.23' }
repositories { mavenCentral() }
dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.1'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.10.0'
    implementation 'com.squareup.retrofit2:converter-jackson:2.10.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.10.0'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.17.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}
sourceSets.main.kotlin {
    srcDir '../../sdk/rest/kotlin/src/main/kotlin'
}
test { useJUnitPlatform() }
