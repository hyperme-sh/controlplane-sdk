plugins { id 'org.jetbrains.kotlin.jvm' version '1.9.23' }
repositories { mavenCentral() }
dependencies {
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.17.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}
sourceSets.main.kotlin {
    srcDir '../../sdk/rest/kotlin/src/main/kotlin'
    include '**/WalletPaymentSubmitRequest.kt', '**/WalletPaymentChallengeRequest.kt',
            '**/WalletPaymentUsdcLeasePaymentCreate.kt', '**/WalletPaymentWalletDepositStatus.kt'
}
test { useJUnitPlatform() }
