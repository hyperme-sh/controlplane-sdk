name: SEA device link unit and contract checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sea-device-link:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/sea-device-link
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm run check:package
